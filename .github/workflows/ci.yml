name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Type-check & Test (Bun ${{ matrix.bun-version }})
    runs-on: ubuntu-latest
    # Test the lowest and highest supported Bun versions (engines.bun in package.json).
    strategy:
      fail-fast: false
      matrix:
        bun-version: [1.4.5]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ matrix.bun-version }}-${{ runner.os }}-${{ hashFiles('bun.lock', 'frontend/bun.lock') }}
          restore-keys: bun-${{ matrix.bun-version }}-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The extension UI builder resolves the UI kit's packages (bits-ui,
      # phosphor-svelte, tailwind-*) from frontend/node_modules.
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Lint & format
        run: bunx biome check

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Run tests
        run: AGENT=1 bun test ./src ./shared
        env:
          OPENAI_API_KEY: sk-test
          OPENAI_API_BASE_URL: http://localhost:11434/v1

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install backend dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Svelte type-check
        run: bun run check
        working-directory: frontend

      - name: Run frontend tests
        run: bun test
        working-directory: frontend

      - name: Build frontend
        run: bun run build
        working-directory: frontend

  portal:
    name: Portal Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-portal-${{ runner.os }}-${{ hashFiles('frontend/bun.lock', 'portal/bun.lock') }}
          restore-keys: bun-portal-${{ runner.os }}-

      # The portal reuses the frontend's UI kit ($lib), whose sources import
      # their packages from frontend/node_modules.
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Install portal dependencies
        run: bun install --frozen-lockfile
        working-directory: portal

      - name: Svelte type-check
        run: bun run check
        working-directory: portal

      - name: Run portal tests
        run: bun test
        working-directory: portal

      - name: Build portal
        run: bun run build
        working-directory: portal
